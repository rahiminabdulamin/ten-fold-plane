services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
        DEPLOY_SOURCE_SHA: ${DEPLOY_SOURCE_SHA:-manual}
        VITE_COPILOTKIT_RUNTIME_URL: ${VITE_COPILOTKIT_RUNTIME_URL:-/api/copilotkit}
    restart: always
    depends_on:
      - api

  copilot:
    container_name: copilot
    build:
      context: .
      dockerfile: ./apps/copilot/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      - api

  grist:
    image: gristlabs/grist:1.7.16
    restart: always
    environment:
      GRIST_SESSION_SECRET: ${GRIST_SESSION_SECRET}
      GRIST_FORWARD_AUTH_HEADER: X-Ten-Fold-User
      GRIST_DEFAULT_EMAIL: spreadsheet-system@tenfold.internal
      GRIST_ADMIN_EMAIL: spreadsheet-system@tenfold.internal
      GRIST_IN_SERVICE: "true"
      GRIST_IGNORE_SESSION: "true"
      GRIST_SUPPORT_ANON: "true"
      GRIST_SERVE_SAME_ORIGIN: "true"
      GRIST_SINGLE_ORG: ten-fold
      GRIST_ORG_IN_PATH: "true"
      # Grist's browser router requires native /o/<org>/ document paths.
      APP_HOME_URL: ${GRIST_PUBLIC_ORIGIN:-http://localhost}
      APP_DOC_URL: ${GRIST_PUBLIC_ORIGIN:-http://localhost}
      # Grist builds its HTML asset base separately from home/document URLs.
      APP_STATIC_URL: ${GRIST_PUBLIC_URL:-http://localhost/grist}
      APP_STATIC_INCLUDE_CUSTOM_CSS: "true"
      GRIST_SANDBOX_FLAVOR: ${GRIST_SANDBOX_FLAVOR:-gvisor}
      GRIST_ENABLE_REQUEST_FUNCTION: "false"
      GRIST_HIDE_UI_ELEMENTS: billing,templates,createSite,multiSite,multiAccounts,importFromAirtable,sendToDrive,tutorials,supportGrist,automations
    volumes:
      - gristdata:/persist
      - ./apps/proxy/grist-custom.css:/grist/static/custom.css:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8484/status',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web

  api:
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; host = os.environ.get('ALLOWED_HOSTS', 'localhost').split(',')[0].strip().lstrip('.'); request = urllib.request.Request('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/', headers={'Host': 'localhost' if host == '*' else host}); urllib.request.urlopen(request, timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 6
    command: ./bin/docker-entrypoint-api.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis
      - grist

  worker:
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "celery -A plane inspect ping --destination celery@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 20s
      start_period: 120s
      retries: 6
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    container_name: beatworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    healthcheck:
      # Beat has no ping API: verify its explicitly configured scheduler PID.
      test: ["CMD", "python", "-c", "import os; os.kill(int(open('/tmp/celerybeat.pid').read()), 0)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 6
    command: ./bin/docker-entrypoint-beat.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    container_name: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: no
    command: ./bin/docker-entrypoint-migrator.sh
    env_file:
      - ./apps/api/.env
    depends_on:
      - plane-db
      - plane-redis

  live:
    container_name: plane-live
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + (process.env.LIVE_BASE_PATH || '/live') + '/health/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 6
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    env_file:
      - ./apps/live/.env

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.11-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12
    restart: always
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  # Comment this if you already have a reverse proxy running
  proxy:
    container_name: proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 6
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    # Preserve TLS certificates and ACME accounts when rebuilding the proxy.
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ${CADDY_TLS_DIRECTORY:-/etc/tenfold/tls}:/etc/caddy/tls:ro
    env_file:
      - .env
    ports:
      - ${LISTEN_HTTP_PORT}:80
      - ${LISTEN_HTTPS_PORT}:443
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    depends_on:
      - web
      - copilot
      - api
      - space
      - admin

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
  gristdata:
  caddy_data:
  caddy_config:
